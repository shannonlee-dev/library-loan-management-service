[project]
name = "library-loan-management-service"
version = "0.1.0"
description = "세션 기반 도서 대여 관리 서비스"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.1"]


[dependency-groups]
dev = ["httpx", "pytest>=8,<9", "ruff"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["smoke: 외부 서비스·실제 데이터 변경 없이 주요 실행 경로 검증"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
