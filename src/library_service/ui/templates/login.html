{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
  <section class="panel narrow">
    <p class="eyebrow">WELCOME BACK</p><h1>다시 만나 반가워요.</h1><p class="muted">로그인하고 다음 이야기를 이어가세요.</p>

    {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
    <a class="social-login" href="/auth/github">GitHub 계정으로 계속하기 ↗</a>
    <div class="auth-separator">또는 아이디로 로그인</div>
    <form action="/login" method="post">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" value="{{ username | default('', true) }}" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" autocomplete="current-password" type="password" required>
      <div class="actions">
        <button type="submit">로그인</button>
        <a class="button secondary" href="/signup">회원가입</a>
      </div>
    </form>
  </section>
{% endblock %}
