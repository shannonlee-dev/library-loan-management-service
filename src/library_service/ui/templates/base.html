<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}코드 도서관{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% if request.app.debug %}
      <link rel="stylesheet" href="/_dev/debug.css">
      <script type="module" src="/_dev/debug.js"></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header>
      <div class="nav">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">▥</span> 코드 도서관</a>
        <nav>
          {% if current_user %}
            <a href="/app">대여 관리</a>
            <span>{{ current_user.display_name }}님 환영합니다</span>
            <form class="inline" action="/logout" method="post">
              <button class="link-button" type="submit">로그아웃</button>
            </form>
          {% else %}
            <a href="/login">로그인</a>
            <a href="/signup">회원가입</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer"><span>코드 도서관 · A SPACE FOR YOUR NEXT CHAPTER</span><span>읽고, 배우고, 연결되다.</span></footer>
  </body>
</html>
